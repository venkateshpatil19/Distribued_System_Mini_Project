# DeployGuard on Docker: 3 controllers, N agents (3 by default) and the dashboard, each in its own container.
# Start: docker compose up -d --build     Stop: docker compose down
# Scale: docker compose up -d --scale agent=10   (or scale.bat 10)
# Dashboard: http://localhost:3000   Controller APIs: http://localhost:8081, 8082, 8083

name: deployguard

x-controller: &controller
  build: ./backend
  image: deployguard-backend
  command: ["controller"]
  # A crashed container (for example the dashboard's Crash button) is started again.
  restart: unless-stopped
  volumes:
    - state:/data

x-controller-env: &controller-env
  HTTP_PORT: "8080"
  GRPC_PORT: "9090"
  PEERS: 1=controller-1:9090,2=controller-2:9090,3=controller-3:9090
  DATA_DIR: /data

services:
  controller-1:
    <<: *controller
    environment: { <<: *controller-env, DG_CONTROLLER_ID: "1" }
    ports: ["8081:8080"]
  controller-2:
    <<: *controller
    environment: { <<: *controller-env, DG_CONTROLLER_ID: "2" }
    ports: ["8082:8080"]
  controller-3:
    <<: *controller
    environment: { <<: *controller-env, DG_CONTROLLER_ID: "3" }
    ports: ["8083:8080"]

  # One agent service, scaled horizontally: docker compose up -d --scale agent=10
  # Each replica registers itself with the leader and pulls the current configuration.
  agent:
    build: ./backend
    image: deployguard-backend
    command: ["agent"]
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      CONTROLLERS: 1=controller-1:9090,2=controller-2:9090,3=controller-3:9090
      HTTP_PORT: "8080"
      JAVA_OPTS: -Xmx128m
    depends_on: [controller-1, controller-2, controller-3]

  dashboard:
    build: ./frontend
    image: deployguard-dashboard
    restart: unless-stopped
    environment:
      CONTROLLER_URL: http://controller-1:8080,http://controller-2:8080,http://controller-3:8080
    ports: ["3000:3000"]
    depends_on: [controller-1, controller-2, controller-3]

volumes:
  state:
